schema_version: 1

context:
  name: notifiers
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/notifiers-${{ version }}.tar.gz
  sha256: 0843dd4ecd092d0c952c011c3b1b16d42f61b51950908a1c2337bef83f4455f3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - notifiers = notifiers_cli.core:entry_point

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }},<4.0
    - click >=8.0.3
    - pydantic >=2.7,<3
    - requests >=2.27.1,<3.0.0

tests:
  - python:
      imports:
        - notifiers
        - notifiers_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - notifiers --help

about:
  summary: The easy way to send notifications
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/notifiers/notifiers

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
    - thewchan
