{% set name = "notifiers" %}
{% set version = "2.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/notifiers-{{ version }}.tar.gz
  sha256: 0843dd4ecd092d0c952c011c3b1b16d42f61b51950908a1c2337bef83f4455f3

build:
  entry_points:
    - notifiers = notifiers_cli.core:entry_point
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - python >={{ python_min }},<4.0
    - click >=8.0.3
    - jsonschema >=4.4.0
    - requests >=2.27.1,<3.0.0
    - importlib-metadata >=3.6

test:
  imports:
    - notifiers
    - notifiers_cli
  commands:
    - pip check
    - notifiers --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/notifiers/notifiers
  summary: The easy way to send notifications
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - conda-forge/rpaframework-core
    - thewchan
